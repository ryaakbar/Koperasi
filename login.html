<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | E-Koperasi Sekolah</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="logo.jpg" alt="Logo" class="logo-icon" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; background: white; margin-bottom: 16px;">
                <h2>Masuk Akun</h2>
                <p>Silakan login untuk mengakses E-Koperasi Sekolah.</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-username" class="form-control" placeholder='Masukkan username "Arya"' required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder='Kata sandi "123"' required>
                </div>
                <div id="login-error" style="color: #ef4444; font-size: 13px; display: none; margin-top: 8px; font-weight: 500;">
                    Username atau password salah!
                </div>
                <button type="submit" class="btn btn-primary w-100" style="margin-top: 16px; padding: 14px;">Masuk</button>
            </form>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
